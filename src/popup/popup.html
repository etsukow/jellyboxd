<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jellyboxd</title>
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="lbx-scope">
  <main class="popup">
    <header class="app-head">
      <img src="../../icons/icon-32.png" alt="" width="22" height="22" />
      <b>Jellyboxd</b>
      <button id="openSettings" type="button" class="lbx-link push">Settings</button>
    </header>

    <section id="ticket" class="gt" aria-labelledby="ticketTitle">
      <div class="gt-top">
        <div class="gt-line"><span id="ticketLeft">Jellyboxd</span><span id="ticketRight"></span></div>
        <h1 id="ticketTitle" class="gt-title">Checking…</h1>
        <p id="ticketText" class="gt-help"></p>
      </div>
      <div class="gt-perf" aria-hidden="true"></div>
      <button id="ticketAction" type="button" class="gt-stub" hidden></button>
    </section>

    <p id="connection" class="dark-state" role="status"></p>
  </main>

  <script src="../shared/browser-api.js"></script>
  <script src="../shared/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
