<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jellyboxd</title>
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="lbx-scope">
  <header class="bar">
    <img src="../../icons/icon-32.png" alt="" width="18" height="18" />
    <b>Jellyboxd</b>
    <button id="openSettings" type="button" class="icon-btn bar-action" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11.3 1.5l.4 2.1c.5.2 1 .5 1.4.8l2-.7 1.3 2.2-1.6 1.4c.1.5.1 1 0 1.5l1.6 1.4-1.3 2.2-2-.7c-.4.3-.9.6-1.4.8l-.4 2.1H8.7l-.4-2.1c-.5-.2-1-.5-1.4-.8l-2 .7-1.3-2.2 1.6-1.4a4.6 4.6 0 0 1 0-1.5L3.6 5.9l1.3-2.2 2 .7c.4-.3.9-.6 1.4-.8l.4-2.1h2.6zM10 7.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"/></svg>
    </button>
  </header>

  <main id="main" aria-live="polite">
    <section id="film" class="film" hidden>
      <img id="poster" class="poster" alt="" width="72" height="108" hidden />
      <div class="film-text">
        <h1 id="filmTitle" class="film-title"></h1>
        <p id="filmMeta" class="film-meta"></p>
        <p id="filmState" class="status"></p>
        <p id="filmDetail" class="film-detail"></p>
      </div>
    </section>

    <section id="message" class="message" hidden>
      <h1 id="messageTitle" class="message-title"></h1>
      <p id="messageText" class="message-text"></p>
    </section>

    <div id="actions" class="actions" hidden>
      <hr class="perf" />
      <button id="primary" type="button" class="btn btn-wide stub"></button>
      <p id="feedback" class="status" hidden></p>
    </div>
  </main>

  <dl id="accounts" class="rows accounts" hidden>
    <div><dt>Seerr</dt><dd id="seerrAccount"></dd></div>
    <div id="jellyfinRow" hidden><dt>Jellyfin</dt><dd id="jellyfinAccount"></dd></div>
  </dl>

  <template id="iconPlay"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2.5v11l9-5.5z"/></svg></template>
  <template id="iconCheck"><svg class="check-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="var(--check)"/><path d="M4.6 8.2l2.2 2.2 4.6-4.8" fill="none" stroke="var(--check-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></template>

  <script src="../shared/browser-api.js"></script>
  <script src="../shared/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
